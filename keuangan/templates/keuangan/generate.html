{% extends "pengguna/base_portal.html" %}
{% block title %}Generate tagihan{% endblock %}
{% block isi %}
<h1 class="h3 mb-3">Generate tagihan massal</h1>
<form method="post">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Jenis</label>
    <select class="form-control" name="jenis" required>
      {% for j in jenis %}<option value="{{ j.pk }}">{{ j.nama }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">Jumlah</label><input class="form-control" name="jumlah" type="number" step="0.01" required></div>
  <div class="mb-3"><label class="form-label">Jatuh tempo</label><input class="form-control" name="jatuh_tempo" type="date" required></div>
  <div class="mb-3">
    <label class="form-label">Periode (opsional)</label>
    <select class="form-control" name="periode">
      <option value="">—</option>
      {% for p in periode %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">RB (kosong = semua santri aktif)</label>
    <select class="form-control" name="rb">
      <option value="">Semua santri aktif</option>
      {% for r in rb %}<option value="{{ r.pk }}">{{ r }}</option>{% endfor %}
    </select>
  </div>
  <button class="btn btn-success" type="submit">Generate</button>
</form>
{% endblock %}
