{% extends "pengguna/base_portal.html" %}
{% block title %}Absensi{% endblock %}
{% block isi %}
<h1 class="h3 mb-3">Pertemuan dan absensi</h1>
<p><a class="btn btn-success btn-sm" href="{% url 'akademik:pertemuan_baru' %}">Pertemuan baru</a></p>
<table class="table table-sm">
  <thead><tr><th>Tanggal</th><th>RB</th><th>Mapel</th><th></th></tr></thead>
  <tbody>
  {% for p in daftar %}
    <tr>
      <td>{{ p.tanggal }}</td>
      <td>{{ p.rb }}</td>
      <td>{{ p.mapel }}</td>
      <td><a href="{% url 'akademik:isi_absensi' p.pk %}">Isi absensi</a></td>
    </tr>
  {% empty %}<tr><td colspan="4">Belum ada pertemuan.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
