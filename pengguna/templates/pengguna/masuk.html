<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Masuk — As-Syamil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:420px;margin-top:8rem;">
  <h1 class="h4 mb-3">Masuk sistem akademik</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Nama pengguna</label>
      <input class="form-control" name="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Sandi</label>
      <input class="form-control" type="password" name="password" required>
    </div>
    <button class="btn btn-success w-100" type="submit">Masuk</button>
  </form>
  <p class="mt-3 small"><a href="{% url 'home' %}">Kembali ke beranda</a> · <a href="/admin/">CMS web</a></p>
</div>
</body>
</html>
