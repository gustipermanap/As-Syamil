{% extends "pengguna/base_portal.html" %}
{% block title %}Pegawai{% endblock %}
{% block isi %}
<h1 class="h3 mb-3">Pegawai</h1>
<p><a class="btn btn-success btn-sm" href="{% url 'kesiswaan:pegawai_baru' %}">Pegawai baru</a></p>
<table class="table table-sm">
  <thead><tr><th>Nama</th><th>Aktif</th><th>Akun</th><th></th></tr></thead>
  <tbody>
  {% for p in daftar %}
    <tr>
      <td>{{ p.nama }}</td>
      <td>{{ p.aktif|yesno:"Ya,Tidak" }}</td>
      <td>{{ p.user|default:"—" }}</td>
      <td><a href="{% url 'kesiswaan:pegawai_status' p.pk %}">Ubah status</a></td>
    </tr>
  {% empty %}<tr><td colspan="4">Belum ada pegawai.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
