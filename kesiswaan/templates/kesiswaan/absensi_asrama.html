{% extends "pengguna/base_portal.html" %}
{% block title %}Absensi asrama{% endblock %}
{% block isi %}
<h1 class="h3 mb-3">Absensi asrama</h1>
<form class="row g-2 mb-3" method="get">
  <div class="col-auto"><input class="form-control" type="date" name="tanggal" value="{{ tanggal }}"></div>
  <div class="col-auto">
    <select class="form-control" name="sesi">
      {% for val, label in sesi_pilihan %}
        <option value="{{ val }}"{% if sesi == val %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto"><button class="btn btn-outline-success">Tampilkan</button></div>
</form>
<form method="post">{% csrf_token %}
  <input type="hidden" name="tanggal" value="{{ tanggal }}">
  <input type="hidden" name="sesi" value="{{ sesi }}">
  <table class="table table-sm">
    <thead><tr><th>Santri</th><th>Status</th></tr></thead>
    <tbody>
    {% for b in baris %}
      <tr>
        <td>{{ b.santri.nama }}</td>
        <td>
          <select class="form-control" name="status_{{ b.santri.pk }}">
            {% for val, label in pilihan %}
              <option value="{{ val }}"{% if b.status == val %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </td>
      </tr>
    {% empty %}<tr><td colspan="2">Belum ada santri di kamar.</td></tr>{% endfor %}
    </tbody>
  </table>
  <button class="btn btn-success" type="submit">Simpan absensi asrama</button>
</form>
{% endblock %}
